@if (open()) {
  <div
    class="fixed inset-0 z-50 flex justify-end"
    (mousedown)="handleBackdrop($event)"
    (keydown)="handleKeydown($event)"
  >
    <div class="absolute inset-0 bg-overlay lg:bg-overlay/30" aria-hidden="true"></div>

    <aside
      #drawerPanel
      [id]="drawerId()"
      class="relative flex h-full w-full max-w-2xl flex-col border-l border-border bg-surface-elevated shadow-floating animate-drawer-panel"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId()"
      [attr.aria-describedby]="description() ? descriptionId() : null"
      [attr.aria-busy]="loading()"
      tabindex="-1"
    >
      <header class="flex shrink-0 items-start gap-5 border-b border-border px-5 py-5 sm:px-6">
        <div class="min-w-0 flex-1">
          <p class="mb-2 flex items-center gap-2 text-eyebrow uppercase text-text-muted">
            <span class="h-px w-5 bg-accent" aria-hidden="true"></span>
            ISANORTE
          </p>
          <h2 [id]="titleId()" class="text-heading-3 text-text-primary">{{ title() }}</h2>
          @if (description()) {
            <p [id]="descriptionId()" class="mt-2 text-body-sm text-text-secondary">
              {{ description() }}
            </p>
          }
        </div>
        @if (loading()) {
          <app-loading layout="inline" size="small" label="Procesando" [showLabel]="false" />
        }
        @if (dismissible()) {
          <button
            type="button"
            class="-m-2 inline-flex size-11 shrink-0 items-center justify-center rounded-control text-text-muted transition-colors duration-150 hover:bg-surface-hover hover:text-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="Cerrar panel"
            [disabled]="loading()"
            (click)="close('button')"
          >
            <svg class="size-5" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path
                d="m5 5 10 10m0-10L5 15"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.5"
              />
            </svg>
          </button>
        }
      </header>

      <div
        class="flex-1 overflow-y-auto px-5 py-6 sm:px-6"
        [class.pointer-events-none]="loading()"
        [class.opacity-60]="loading()"
      >
        <ng-content />
      </div>

      <footer
        class="flex shrink-0 flex-col-reverse gap-3 border-t border-border px-5 py-4 sm:flex-row sm:justify-end sm:px-6"
        [class.pointer-events-none]="loading()"
        [class.opacity-60]="loading()"
      >
        <ng-content select="[drawer-actions]" />
      </footer>
    </aside>
  </div>
}
