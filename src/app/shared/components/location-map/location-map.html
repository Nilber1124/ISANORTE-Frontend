<div class="min-w-0">
  @if (safeMapEmbedUrl(); as embedUrl) {
    <div class="h-28 overflow-hidden rounded-control border border-border bg-surface-soft">
      <iframe
        class="h-full w-full border-0"
        [src]="embedUrl"
        [title]="'Mapa de ubicación: ' + direccion()"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen
      ></iframe>
    </div>
  }

  <p class="mt-3 text-caption text-text-secondary">{{ direccion() }}</p>

  @if (safeMapUrl(); as externalUrl) {
    <a
      class="mt-1 inline-flex text-caption font-semibold text-accent transition-colors duration-normal hover:text-accent-hover focus-visible:rounded-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
      [href]="externalUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      Ver en Google Maps →
    </a>
  }
</div>
