<div class="space-y-3">
  <div
    #map
    class="h-72 w-full overflow-hidden rounded-control border border-border bg-surface-soft"
    role="application"
    aria-label="Mapa para elegir la ubicación de la oficina"
  ></div>
  <div class="flex flex-wrap items-center justify-between gap-3 text-body-sm text-text-secondary">
    <span>
      @if (formatted(); as value) {
        Ubicación elegida: <strong class="text-text-primary">{{ value }}</strong>
      } @else {
        Haz clic en el mapa para colocar el pin. Arrástralo para ajustarlo.
      }
    </span>
    @if (formatted()) {
      <button
        type="button"
        class="font-semibold text-accent hover:underline disabled:opacity-50"
        [disabled]="disabled()"
        (click)="clear()"
      >
        Quitar ubicación
      </button>
    }
  </div>
</div>
