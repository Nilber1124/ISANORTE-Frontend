<div>
  <label
    [for]="inputId()"
    class="form-label transition-colors duration-fast"
    [class.sr-only]="hideLabel()"
  >
    {{ label() }}
    @if (required()) {
      <span class="text-error" aria-hidden="true">*</span>
      <span class="sr-only">(obligatorio)</span>
    }
  </label>

  <div class="relative">
    <input
      class="form-control pr-11"
      [id]="inputId()"
      [type]="type()"
      [value]="value() ?? ''"
      [name]="name()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [attr.inputmode]="inputMode()"
      [attr.minlength]="minLength()"
      [attr.maxlength]="maxLength()"
      [disabled]="disabled()"
      [readOnly]="readonly() || loading()"
      [required]="required()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-busy]="loading()"
      (input)="updateValue($event)"
      (focus)="focused.emit($event)"
      (blur)="blurred.emit($event)"
    />
    @if (loading()) {
      <span
        class="pointer-events-none absolute inset-y-0 right-4 flex items-center text-text-muted"
        aria-hidden="true"
      >
        <span
          class="size-4 animate-spin rounded-full border-2 border-current border-r-transparent"
        ></span>
      </span>
    }
  </div>

  @if (error()) {
    <span [id]="feedbackId()" class="form-error" role="alert">{{ error() }}</span>
  } @else if (helperText()) {
    <span [id]="feedbackId()" class="form-helper">{{ helperText() }}</span>
  }
</div>
