<div>
  <label [for]="inputId()" class="form-label transition-colors duration-fast">
    {{ label() }}
    @if (required()) {
      <span class="text-error" aria-hidden="true">*</span>
      <span class="sr-only">(obligatorio)</span>
    }
  </label>

  <div class="relative">
    <select
      class="form-control appearance-none pr-12"
      [id]="inputId()"
      [value]="value()"
      [name]="name()"
      [disabled]="disabled() || loading()"
      [required]="required()"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-busy]="loading()"
      (change)="updateValue($event)"
      (focus)="focused.emit($event)"
      (blur)="blurred.emit($event)"
    >
      @if (placeholder()) {
        <option value="" [disabled]="required()">{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled ?? false">
          {{ option.label }}
        </option>
      }
    </select>
    <span
      class="pointer-events-none absolute inset-y-0 right-4 flex items-center text-text-muted"
      aria-hidden="true"
    >
      @if (loading()) {
        <span
          class="size-4 animate-spin rounded-full border-2 border-current border-r-transparent"
        ></span>
      } @else {
        <svg class="size-4" viewBox="0 0 16 16" fill="none">
          <path
            d="m4 6 4 4 4-4"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
          />
        </svg>
      }
    </span>
  </div>

  @if (error()) {
    <span [id]="feedbackId()" class="form-error" role="alert">{{ error() }}</span>
  } @else if (helperText()) {
    <span [id]="feedbackId()" class="form-helper">{{ helperText() }}</span>
  }
</div>
