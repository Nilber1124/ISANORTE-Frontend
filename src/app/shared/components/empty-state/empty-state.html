<section
  [class]="classes()"
  [attr.aria-labelledby]="titleId()"
  [attr.aria-describedby]="description() ? descriptionId() : null"
>
  <div
    class="mx-auto mb-5 flex size-12 items-center justify-center rounded-card border border-border bg-surface-elevated text-text-muted"
    aria-hidden="true"
  >
    <ng-content select="[empty-state-icon]">
      <svg class="size-5" viewBox="0 0 20 20" fill="none">
        <path
          d="M4 5.5h12v10H4zM7 3.5h6M7 9h6m-6 3h4"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.25"
        />
      </svg>
    </ng-content>
  </div>
  <h3 [id]="titleId()" class="text-heading-4 text-text-primary">{{ title() }}</h3>
  @if (description()) {
    <p [id]="descriptionId()" class="mx-auto mt-3 max-w-lg text-body-sm text-text-secondary">
      {{ description() }}
    </p>
  }
  <div class="mt-6 flex flex-wrap justify-center gap-3">
    <ng-content select="[empty-state-actions]" />
  </div>
</section>
