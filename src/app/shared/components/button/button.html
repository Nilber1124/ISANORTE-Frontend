<ng-template #content>
  @if (loading()) {
    <span
      class="size-4 animate-spin rounded-full border-2 border-current border-r-transparent"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</ng-template>

@if (href()) {
  <a
    [class]="classes()"
    [attr.href]="isUnavailable() ? null : href()"
    [attr.target]="target()"
    [attr.rel]="target() === '_blank' ? 'noopener noreferrer' : null"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-disabled]="isUnavailable()"
    [attr.aria-busy]="loading()"
    [attr.tabindex]="isUnavailable() ? -1 : null"
    (click)="preventUnavailableLink($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button
    [class]="classes()"
    [type]="type()"
    [disabled]="isUnavailable()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-busy]="loading()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
