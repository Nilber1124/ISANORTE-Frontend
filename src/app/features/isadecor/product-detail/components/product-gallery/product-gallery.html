<section aria-label="Galería del producto">
  <div
    class="aspect-[4/3] overflow-hidden rounded-panel border border-border/60 bg-surface-soft/40 shadow-soft"
  >
    @if (mainImage(); as image) {
      <img
        class="h-full w-full object-cover transition-transform duration-entry hover:scale-[1.02]"
        [src]="image.url"
        [alt]="imageAlt(image)"
        width="960"
        height="720"
        loading="eager"
        fetchpriority="high"
        (error)="markImageAsFailed(image.url)"
      />
    } @else {
      <div
        class="flex h-full min-h-64 w-full flex-col items-center justify-center gap-4 bg-surface-soft p-8 text-center text-text-muted sm:min-h-80"
        role="img"
        [attr.aria-label]="'Imagen no disponible para ' + productName()"
      >
        <svg class="size-16" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <path
            d="M10 17h44v34H10zM18 11h28v6M19 28h26M19 36h18"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
          />
        </svg>
        <span class="text-body-sm font-semibold">Imagen no disponible</span>
      </div>
    }
  </div>

  @if (availableImages().length > 1) {
    <div class="mt-4 grid grid-cols-4 gap-3 sm:grid-cols-5" aria-label="Seleccionar imagen">
      @for (image of availableImages(); track image.url; let index = $index) {
        <button
          type="button"
          class="aspect-square min-w-0 overflow-hidden rounded-control border bg-surface transition-[border-color,box-shadow,opacity] duration-fast focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-background"
          [class.border-text-primary]="mainImage()?.url === image.url"
          [class.ring-1]="mainImage()?.url === image.url"
          [class.ring-text-primary]="mainImage()?.url === image.url"
          [class.border-border/60]="mainImage()?.url !== image.url"
          [class.opacity-70]="mainImage()?.url !== image.url"
          [class.hover:opacity-100]="mainImage()?.url !== image.url"
          [attr.aria-label]="'Ver imagen ' + (index + 1) + ' de ' + productName()"
          [attr.aria-pressed]="mainImage()?.url === image.url"
          (click)="selectImage(image.url)"
        >
          <img
            class="h-full w-full object-cover"
            [src]="image.url"
            alt=""
            width="160"
            height="160"
            loading="lazy"
            (error)="markImageAsFailed(image.url)"
          />
        </button>
      }
    </div>
  }
</section>
