<app-modal
  modalId="social-network-form-modal"
  [title]="mode() === 'create' ? 'Nueva red social' : 'Editar red social'"
  description="Completa los datos de la red social."
  size="medium"
  [open]="true"
  [loading]="submitting()"
  (closed)="canceled.emit()"
>
  <form id="social-network-form" (submit)="submit(); $event.preventDefault()" novalidate>
    <div class="grid gap-4 sm:grid-cols-2">
      <app-input-field
        inputId="sn-nombre"
        label="Nombre"
        [(value)]="nombre"
        [error]="nombreError()"
        [disabled]="submitting()"
        required
      />
      <app-input-field
        inputId="sn-orden"
        type="number"
        label="Orden"
        [(value)]="orden"
        [disabled]="submitting()"
      />
      <app-input-field
        class="sm:col-span-2"
        inputId="sn-url"
        type="url"
        label="URL"
        [(value)]="url"
        [error]="urlError()"
        [disabled]="submitting()"
        required
      />
      <app-input-field
        class="sm:col-span-2"
        inputId="sn-icono"
        label="Icono"
        [(value)]="icono"
        [disabled]="submitting()"
      />
      
      <fieldset class="sm:col-span-2 rounded-card border border-border p-4 mt-2">
        <legend class="px-1 text-body-sm font-semibold text-text-primary">Visibilidad</legend>
        <label class="mt-3 flex min-h-11 items-center gap-3 text-body-sm text-text-secondary">
          <input
            class="form-choice"
            type="checkbox"
            [checked]="activo()"
            [disabled]="submitting()"
            (change)="updateActive($event)"
          />Red activa
        </label>
      </fieldset>
    </div>
  </form>

  <div modal-actions class="flex w-full flex-col-reverse gap-3 sm:flex-row sm:justify-end">
    <app-button
      type="button"
      variant="secondary"
      [disabled]="submitting()"
      (click)="canceled.emit()"
    >
      Cancelar
    </app-button>
    <app-button
      [loading]="submitting()"
      [disabled]="submitting()"
      (click)="submit()"
    >
      {{ mode() === 'create' ? 'Crear' : 'Guardar' }}
    </app-button>
  </div>
</app-modal>
