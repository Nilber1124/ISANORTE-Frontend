@if (field() !== 'ambos') {
  <app-field-editor
    [heading]="heading()"
    [label]="field() === 'ofertas' ? 'Puntos de oferta' : 'Descripción'"
    [value]="savedValue()"
    [rows]="field() === 'ofertas' ? 5 : 4"
    [helper]="field() === 'ofertas' ? 'Un punto por línea. Se ven en la página al guardar.' : undefined"
    [loading]="loading()"
    [busy]="saving()"
    [error]="error()"
    (draftChanged)="onSingleDraft($event)"
    (saved)="saveSingle($event)"
    (closed)="closed.emit()"
  />
} @else {
  <section class="rounded-card border border-border bg-surface shadow-card" [attr.aria-label]="heading()">
    <header class="flex items-start justify-between gap-3 border-b border-border p-5">
      <div>
        <p class="text-eyebrow uppercase text-text-muted">Editando</p>
        <h2 class="mt-1 text-heading-3 text-text-primary">{{ heading() }}</h2>
      </div>
      <app-button size="small" variant="ghost" (click)="closed.emit()">← Volver</app-button>
    </header>
    <div class="space-y-4 p-5">
      @if (loading()) {
        <p class="text-body-sm text-text-muted" role="status">Cargando…</p>
      } @else {
        @if (error(); as message) {
          <p class="rounded-control border border-error/40 bg-error/10 p-3 text-body-sm text-error" role="alert">{{ message }}</p>
        }
        <app-textarea-field inputId="unit-descripcion" label="Descripción" [(value)]="descripcionText" [rows]="4" [disabled]="saving()" />
        <app-textarea-field inputId="unit-ofertas" label="Puntos de oferta" [(value)]="ofertasText" [rows]="5" helperText="Un punto por línea. Se ven en la página al guardar." [disabled]="saving()" />
        <div class="flex items-center gap-3">
          <app-button variant="primary" [disabled]="!dirtyBoth() || saving()" [loading]="saving()" (click)="saveBoth()">Guardar</app-button>
          @if (dirtyBoth()) {
            <span class="text-caption text-text-muted" role="status">Cambios sin guardar</span>
          }
        </div>
      }
    </div>
  </section>
}
