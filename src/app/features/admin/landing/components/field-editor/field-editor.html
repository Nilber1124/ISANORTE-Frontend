<section class="rounded-card border border-border bg-surface shadow-card" [attr.aria-label]="heading()">
  <header class="flex items-start justify-between gap-3 border-b border-border p-5">
    <div>
      <p class="text-eyebrow uppercase text-text-muted">Editando</p>
      <h2 class="mt-1 text-heading-3 text-text-primary">{{ heading() }}</h2>
    </div>
    <app-button size="small" variant="ghost" (click)="closed.emit()">← Volver</app-button>
  </header>

  <div class="space-y-4 p-5">
    @if (loading()) {
      <p class="text-body-sm text-text-muted" role="status">Cargando…</p>
    } @else {
      @if (error(); as message) {
        <p class="rounded-control border border-error/40 bg-error/10 p-3 text-body-sm text-error" role="alert">{{ message }}</p>
      }
      @if (rows() > 1) {
        <app-textarea-field
          inputId="field-editor-input"
          [label]="label()"
          [(value)]="text"
          [rows]="rows()"
          [helperText]="helper()"
          [required]="required()"
          [disabled]="busy()"
        />
      } @else {
        <app-input-field
          inputId="field-editor-input"
          [label]="label()"
          [(value)]="text"
          [helperText]="helper()"
          [required]="required()"
          [disabled]="busy()"
        />
      }
      <div class="flex items-center gap-3">
        <app-button variant="primary" [disabled]="!dirty() || invalid() || busy()" [loading]="busy()" (click)="save()">
          Guardar
        </app-button>
        @if (dirty()) {
          <span class="text-caption text-text-muted" role="status">Cambios sin guardar · ya se ven en la vista previa</span>
        }
      </div>
    }
  </div>
</section>
