<section class="rounded-card border border-border bg-surface shadow-card" aria-label="Ubicación en el mapa">
  <header class="flex items-start justify-between gap-3 border-b border-border p-5">
    <div>
      <p class="text-eyebrow uppercase text-text-muted">Editando</p>
      <h2 class="mt-1 text-heading-3 text-text-primary">Ubicación en el mapa</h2>
    </div>
    <app-button size="small" variant="ghost" (click)="closed.emit()">← Volver</app-button>
  </header>
  <div class="space-y-4 p-5">
    @if (loading()) {
      <p class="text-body-sm text-text-muted" role="status">Cargando…</p>
    } @else {
      @if (error(); as message) {
        <p class="rounded-control border border-error/40 bg-error/10 p-3 text-body-sm text-error" role="alert">{{ message }}</p>
      }
      @if (company()) {
        <p class="text-body-sm text-text-secondary">Toca el mapa para colocar el punto de la oficina.</p>
        <app-location-picker [(latitud)]="latitud" [(longitud)]="longitud" [disabled]="saving()" />
        <app-input-field
          inputId="map-direccion"
          label="Dirección que se muestra bajo el mapa"
          [(value)]="direccion"
          [disabled]="saving()"
        />
        <div class="flex items-center gap-3">
          <app-button variant="primary" [disabled]="!dirty() || saving()" [loading]="saving()" (click)="save()">Guardar</app-button>
          @if (dirty()) {
            <span class="text-caption text-text-muted" role="status">Cambios sin guardar</span>
          }
        </div>
      }
    }
  </div>
</section>
