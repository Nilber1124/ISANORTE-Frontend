<app-modal
  modalId="service-form-modal"
  [title]="mode() === 'create' ? 'Nuevo servicio' : 'Editar servicio'"
  description="Completa la información que se utilizará en la presentación pública del servicio."
  size="large"
  [open]="true"
  [loading]="submitting()"
  (closed)="canceled.emit()"
>
  @if (serverError(); as error) {
    <app-alert class="mb-5" variant="error" title="No se guardó el servicio">
      {{ error }}
    </app-alert>
  }

  <form
    id="service-form"
    class="grid gap-5 sm:grid-cols-2"
    (submit)="submit(); $event.preventDefault()"
    novalidate
  >
    <app-input-field
      inputId="service-name"
      label="Nombre"
      [(value)]="nombre"
      [error]="errors().nombre"
      [disabled]="submitting()"
      required
    />
    <app-input-field
      inputId="service-slug"
      label="Slug"
      [(value)]="slug"
      helperText="Se mantiene manual, editable y debe ser único."
      [error]="errors().slug"
      [disabled]="submitting()"
      required
    />
    <app-textarea-field
      class="sm:col-span-2"
      inputId="service-summary"
      label="Resumen"
      [(value)]="resumen"
      [rows]="3"
      [disabled]="submitting()"
    />
    <app-textarea-field
      class="sm:col-span-2"
      inputId="service-description"
      label="Descripción"
      [(value)]="descripcion"
      [rows]="5"
      [error]="errors().descripcion"
      [disabled]="submitting()"
      required
    />
    <app-input-field
      inputId="service-icon"
      label="Icono"
      [(value)]="icono"
      helperText="Valor textual interpretado por la presentación pública."
      [disabled]="submitting()"
    />
    <app-input-field
      inputId="service-order"
      label="Orden"
      type="number"
      inputMode="numeric"
      [(value)]="orden"
      [error]="errors().orden"
      [disabled]="submitting()"
      [required]="mode() === 'edit'"
    />
    <app-input-field
      class="sm:col-span-2"
      inputId="service-image-url"
      label="Imagen URL"
      type="url"
      [value]="imagenUrl()"
      (valueChange)="updateImageUrl($event)"
      placeholder="https://..."
      [disabled]="submitting()"
    />

    @if (imagenUrl().trim()) {
      <div class="sm:col-span-2" aria-live="polite">
        <p class="mb-2 text-caption font-semibold uppercase tracking-wider text-text-muted">
          Vista previa
        </p>
        @if (previewFailed()) {
          <div
            class="flex min-h-36 items-center justify-center rounded-card border border-dashed border-border bg-surface-soft px-5 text-center text-body-sm text-text-muted"
            role="status"
          >
            No se pudo mostrar la imagen. La URL todavía puede guardarse.
          </div>
        } @else {
          <img
            class="h-44 w-full rounded-card border border-border bg-surface-soft object-cover"
            [src]="imagenUrl()"
            alt="Vista previa de la imagen del servicio"
            (error)="markPreviewFailed()"
          />
        }
      </div>
    }

    <fieldset class="sm:col-span-2 rounded-card border border-border p-4">
      <legend class="px-1 text-body-sm font-semibold text-text-primary">Publicación</legend>
      <div class="mt-3 grid gap-3 sm:grid-cols-2">
        <label class="flex min-h-11 items-center gap-3 text-body-sm text-text-secondary">
          <input
            class="form-choice"
            type="checkbox"
            name="service-featured"
            [checked]="destacado()"
            [disabled]="submitting()"
            (change)="updateFeatured($event)"
          />
          Servicio destacado
        </label>
        <label class="flex min-h-11 items-center gap-3 text-body-sm text-text-secondary">
          <input
            class="form-choice"
            type="checkbox"
            name="service-active"
            [checked]="activo()"
            [disabled]="submitting()"
            (change)="updateActive($event)"
          />
          Servicio activo
        </label>
      </div>
    </fieldset>
  </form>

  <div modal-actions class="flex w-full flex-col-reverse gap-3 sm:flex-row sm:justify-end">
    <app-button variant="secondary" [disabled]="submitting()" (click)="canceled.emit()">
      Cancelar
    </app-button>
    <app-button
      variant="primary"
      [loading]="submitting()"
      [disabled]="submitting()"
      (click)="submit()"
    >
      {{ mode() === 'create' ? 'Crear servicio' : 'Guardar cambios' }}
    </app-button>
  </div>
</app-modal>
