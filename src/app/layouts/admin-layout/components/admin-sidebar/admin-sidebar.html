<aside
  id="admin-sidebar"
  class="fixed inset-y-0 left-0 z-40 w-72 border-r border-border bg-surface pt-16 transition-transform duration-normal lg:translate-x-0"
  [class.translate-x-0]="open()"
  [class.-translate-x-full]="!open()"
>
  <div class="flex h-full flex-col overflow-y-auto px-4 py-6">
    <div class="mb-6 px-3">
      <a
        routerLink="/admin"
        class="inline-flex items-center gap-3 rounded-control focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
        (click)="navigationSelected.emit()"
      >
        <img
          src="/images/isanorte-isotipo.svg"
          alt="ISANORTE"
          class="size-9 object-contain shrink-0"
        />
        <span>
          <span class="block text-body-sm font-semibold tracking-wide text-text-primary"
            >ISANORTE</span
          >
          <span class="block text-caption uppercase tracking-wider text-text-muted"
            >Administración</span
          >
        </span>
      </a>
    </div>

    <nav aria-label="Navegación administrativa" class="space-y-6">
      @for (group of navigationGroups; track group.title) {
        <div>
          <p class="mb-2 px-3 text-caption font-semibold uppercase tracking-wider text-text-muted">
            {{ group.title }}
          </p>
          <ul class="space-y-1">
            @for (item of group.items; track item.route) {
              <li>
                <a
                  [routerLink]="item.route"
                  routerLinkActive="border-accent bg-surface-hover text-text-primary"
                  [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                  ariaCurrentWhenActive="page"
                  class="flex min-h-11 items-center justify-between rounded-control border-l-2 border-transparent px-3 py-2.5 text-body-sm font-medium text-text-secondary transition-colors duration-fast hover:bg-surface-hover hover:text-text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
                  (click)="navigationSelected.emit()"
                >
                  <div class="flex items-center gap-3">
                    <span
                      class="size-1.5 shrink-0 rounded-full bg-current opacity-60"
                      aria-hidden="true"
                    ></span>
                    {{ item.label }}
                  </div>
                  @if (item.badge) {
                    <span
                      class="rounded bg-accent/15 px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider text-accent"
                    >
                      {{ item.badge }}
                    </span>
                  }
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>

    <p class="mt-auto border-t border-border px-3 pt-5 text-caption text-text-muted">
      Autenticación administrativa pendiente.
    </p>
  </div>
</aside>
