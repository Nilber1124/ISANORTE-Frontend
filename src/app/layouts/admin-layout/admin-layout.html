<div class="min-h-screen bg-background text-text-primary">
  <app-admin-topbar [menuOpen]="mobileMenuOpen()" (menuToggle)="toggleMobileMenu()" />

  <app-admin-sidebar [open]="mobileMenuOpen()" (navigationSelected)="closeMobileMenu()" />

  @if (mobileMenuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-overlay lg:hidden"
      aria-label="Cerrar menú administrativo"
      (click)="closeMobileMenu()"
    ></button>
  }

  <main id="admin-main-content" class="min-w-0 pt-16 lg:pl-72">
    <div class="mx-auto w-full max-w-[100rem] px-4 py-8 sm:px-6 lg:px-10 lg:py-10">
      <router-outlet />
    </div>
  </main>
</div>
