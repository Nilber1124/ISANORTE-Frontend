<nav class="bg-brand px-6 py-4 sticky top-0 z-50" aria-label="Navegación principal">
  <div class="flex items-center justify-between gap-6">
    <a routerLink="/" class="flex min-w-0 shrink items-center md:w-64" (click)="closeNavigation()">
      <img
        class="h-10 w-auto min-w-0 max-w-64 object-contain"
        [src]="
          facade.brandLogoWhite() ||
          facade.brandLogo() ||
          '/images/isanorte-logo-horizontal-white.svg'
        "
        [alt]="facade.siteName() || 'ISANORTE'"
      />
    </a>

    <div class="hidden nav-md:flex items-center justify-center gap-8 flex-1">
      @for (link of navigationLinks; track link.url) {
        <a
          [routerLink]="link.url"
          routerLinkActive="text-white"
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: link.url === '/' }"
          class="group text-body-sm font-medium text-white/60 hover:text-white transition-colors relative"
        >
          {{ link.label }}
          <span
            class="absolute -bottom-2 left-0 w-4 h-[2px] bg-accent origin-left transition-transform duration-normal group-hover:scale-x-100"
            [ngClass]="rla.isActive ? 'scale-x-100' : 'scale-x-0'"
          ></span>
        </a>
      }

      <a
        routerLink="/isadecor"
        target="_blank"
        rel="noopener"
        class="group text-body-sm font-medium text-white/60 hover:text-white transition-colors relative"
      >
        ISADECOR
      </a>
    </div>

    <div class="hidden nav-md:flex shrink-0 items-center gap-3">
      <a
        routerLink="/contacto"
        class="inline-flex min-h-10 cursor-pointer items-center rounded-button bg-accent px-5 text-body-sm font-semibold text-accent-contrast transition-colors duration-normal hover:bg-accent-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 focus-visible:ring-offset-brand"
      >
        Contacto
      </a>
    </div>

    <button
      type="button"
      class="nav-md:hidden inline-flex size-11 items-center justify-center rounded-control border border-white/20 text-white hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
      aria-label="Abrir navegación"
      aria-controls="public-mobile-menu"
      [attr.aria-expanded]="mobileMenuOpen()"
      (click)="toggleMobileMenu()"
    >
      <svg class="size-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        @if (mobileMenuOpen()) {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18 18 6M6 6l12 12"
          />
        } @else {
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        }
      </svg>
    </button>
  </div>

  @if (mobileMenuOpen()) {
    <div id="public-mobile-menu" class="nav-md:hidden border-t border-white/10 mt-4 pt-4 pb-2">
      <div class="flex flex-col gap-1">
        @for (link of navigationLinks; track link.url) {
          <a
            [routerLink]="link.url"
            routerLinkActive="bg-white/10 text-white"
            [routerLinkActiveOptions]="{ exact: link.url === '/' }"
            class="rounded-control px-4 py-3 text-body-sm font-medium text-white/70 hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
            (click)="closeNavigation()"
          >
            {{ link.label }}
          </a>
        }

        <a
          routerLink="/isadecor"
          target="_blank"
          rel="noopener"
          (click)="closeNavigation()"
          class="rounded-control px-4 py-3 text-body-sm font-medium text-white/70 hover:bg-white/10 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
        >
          ISADECOR
        </a>
        <a
          routerLink="/contacto"
          (click)="closeNavigation()"
          class="mt-2 rounded-button bg-accent px-4 py-3 text-center text-body-sm font-semibold text-accent-contrast hover:bg-accent-hover focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
        >
          Contacto
        </a>
      </div>
    </div>
  }
</nav>
