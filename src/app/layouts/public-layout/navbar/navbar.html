<nav class="bg-brand px-6 py-4 flex items-center justify-between sticky top-0 z-50">
  <a routerLink="/" class="flex items-center gap-3 w-64">
    <div
      class="size-9 bg-accent flex items-center justify-center font-bold text-white rounded-[4px]"
    >
      IN
    </div>
    <div class="flex flex-col">
      <span class="text-white font-bold tracking-widest text-lg leading-none">{{
        navbarData.logoText
      }}</span>
      <span class="text-[9px] text-white/50 tracking-[0.2em] leading-tight mt-1"
        >CONSTRUCCIÓN & ACABADOS</span
      >
    </div>
  </a>

  <div class="hidden md:flex items-center justify-center gap-8 flex-1">
    @for (link of navbarData.links; track link.label) {
      <a
        [routerLink]="link.url"
        routerLinkActive="text-white"
        #rla="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: link.url === '/' }"
        class="group text-body-sm font-medium transition-colors relative"
        [ngClass]="link.isAccent ? 'text-accent' : 'text-white/60 hover:text-white'"
      >
        {{ link.label }}
        <span
          class="absolute -bottom-2 left-0 w-4 h-[2px] bg-accent origin-left transition-transform duration-normal group-hover:scale-x-100"
          [ngClass]="rla.isActive ? 'scale-x-100' : 'scale-x-0'"
        ></span>
      </a>
    }
  </div>

  <div class="w-64 flex justify-end hidden md:flex">
    <app-button variant="accent" [href]="navbarData.cta.url" size="small">
      {{ navbarData.cta.label }}
    </app-button>
  </div>
</nav>
