  /api/servicios/{id}/activo:
    patch:
      tags: [Servicios]
      operationId: cambiarActivoServicio
      summary: Activa o desactiva lógicamente un servicio
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivoRequest'}
      responses:
        '200': {$ref: '#/components/responses/ServicioOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/servicios/slug/{slug}:
    get:
      tags: [Servicios]
      operationId: obtenerServicioPorSlug
      summary: Obtiene un servicio por slug sin filtro de actividad
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': {$ref: '#/components/responses/ServicioOk'}
