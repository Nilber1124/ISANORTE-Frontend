components:
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductoId:
      name: productoId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProyectoId:
      name: proyectoId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VarianteId:
      name: varianteId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImagenId:
      name: imagenId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EspecificacionId:
      name: especificacionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DocumentoId:
      name: documentoId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    Sku:
      name: sku
      in: path
      required: true
      schema: {type: string}
    CodigoCotizacion:
      name: codigo
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Request inválido, validación fallida o JSON no legible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    NotFound:
      description: Recurso o relación no encontrada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Conflict:
      description: Estado, duplicado o integridad en conflicto
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    AdministradorOk:
      description: Administrador encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdministradorResponse'}
    CategoriasOk:
      description: Lista de categorías
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/CategoriaProductoResponse'}
    CotizacionOk:
      description: Cotización encontrada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CotizacionResponse'}
    CotizacionesOk:
      description: Lista de cotizaciones
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/CotizacionResponse'}
    EmpresasOk:
      description: Lista de empresas
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/EmpresaResponse'}
    ProductoOk:
      description: Producto encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductoResponse'}
    ProductosOk:
      description: Lista de productos
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/ProductoResponse'}
    ProyectoOk:
      description: Proyecto encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProyectoResponse'}
    ProyectosOk:
      description: Lista de proyectos
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/ProyectoResponse'}
    SeccionesOk:
      description: Lista de secciones
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/SeccionLandingResponse'}
    ServicioOk:
      description: Servicio encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServicioResponse'}
    ServiciosOk:
      description: Lista de servicios
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/ServicioResponse'}
    UnidadOk:
      description: Unidad encontrada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnidadNegocioResponse'}
    UnidadesOk:
      description: Lista de unidades
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/UnidadNegocioResponse'}
  schemas:
    CanalCotizacion:
      type: string
      enum: [FORMULARIO, WHATSAPP]
    EstadoCotizacion:
      type: string
      enum: [NUEVA, EN_REVISION, CONTACTADA, COTIZADA, CERRADA, CANCELADA]
    EstadoDisponibilidad:
      type: string
      enum: [DISPONIBLE, AGOTADO, BAJO_PEDIDO, CONSULTAR]
    EstadoPublicacion:
      type: string
      enum: [BORRADOR, PUBLICADO, OCULTO]
    TipoDocumentoProducto:
      type: string
      enum: [CATALOGO, FICHA_TECNICA, MANUAL, OTRO]
    TipoImagenProyecto:
      type: string
      enum: [GENERAL, ANTES, DESPUES]
    TipoSeccionLanding:
      type: string
      enum: [HERO, EMPRESA, SERVICIOS, UNIDAD_NEGOCIO, PROYECTOS, CONTACTO, CTA, PERSONALIZADA]

    AdministradorRequest:
      type: object
      description: DTO existente sin endpoint HTTP consumidor actual.
      required: [nombre, email]
      properties:
        nombre: {type: string, minLength: 1}
        apellido: {type: string, nullable: true}
        email: {type: string, format: email, minLength: 1}
        telefono: {type: string, nullable: true}
        activo: {type: boolean, nullable: true}
    CategoriaProductoRequest:
      type: object
      required: [nombre, slug]
      properties:
        nombre: {type: string, minLength: 1}
        slug: {type: string, minLength: 1}
        descripcion: {type: string, nullable: true}
        imagenUrl: {type: string, nullable: true}
        activo: {type: boolean, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
        unidadNegocioId: {type: string, format: uuid, nullable: true}
    ConfiguracionSitioRequest:
      type: object
      required: [empresaId]
      properties:
        empresaId: {type: string, format: uuid}
        clave: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100, nullable: true, description: 'Temporalmente opcional por compatibilidad; si falta se genera site-{empresaId}.'}
        tituloSitio: {type: string, nullable: true}
        descripcionSitio: {type: string, nullable: true}
        logoUrl: {type: string, nullable: true}
        logoBlancoUrl: {type: string, nullable: true}
        faviconUrl: {type: string, nullable: true}
        colorPrimario: {type: string, nullable: true}
        colorSecundario: {type: string, nullable: true}
        textoPiePagina: {type: string, nullable: true}
        secciones:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ConfiguracionSeccionRequest'}
    ConfiguracionSeccionRequest:
      type: object
      required: [tipo]
      properties:
        tipo: {$ref: '#/components/schemas/TipoSeccionLanding'}
        etiqueta: {type: string, maxLength: 180, nullable: true}
        titulo: {type: string, nullable: true}
        subtitulo: {type: string, nullable: true}
        contenido: {type: string, nullable: true}
        imagenUrl: {type: string, nullable: true}
        imagenAlt: {type: string, maxLength: 300, nullable: true}
        textoBoton: {type: string, nullable: true}
        enlaceBoton: {type: string, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
        visible: {type: boolean, nullable: true}
    CotizacionRequest:
      type: object
      required: [nombreCliente, emailCliente, telefonoCliente, canal, detalles]
      properties:
        nombreCliente: {type: string, minLength: 1}
        emailCliente: {type: string, format: email, minLength: 1}
        telefonoCliente: {type: string, minLength: 1}
        empresaCliente: {type: string, nullable: true}
        ciudad: {type: string, nullable: true}
        mensaje: {type: string, nullable: true}
        canal: {$ref: '#/components/schemas/CanalCotizacion'}
        detalles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CotizacionDetalleRequest'}
