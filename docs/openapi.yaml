openapi: 3.0.3
info:
  title: ISANORTE / ISADECO API
  version: 0.0.1-SNAPSHOT
  description: |
    Contrato estático derivado de los Controllers y DTO, actualizado el 2026-09-20.
    No implica integración de Swagger/OpenAPI en Spring Boot. Security/JWT no está implementado;
    `x-access-intent` expresa el acceso previsto y no una protección efectiva.
x-contract-audit:
  controllers: 14
  paths: 83
  operations: 116
  get: 50
  post: 23
  put: 23
  patch: 9
  delete: 11
x-security-status: NOT_IMPLEMENTED
servers:
  - url: http://localhost:8080
    description: Desarrollo local con el puerto predeterminado de Spring Boot
tags:
  - name: Administradores
  - name: Categorías
  - name: Configuración del sitio
  - name: Cotizaciones
  - name: Empresa
  - name: Productos
  - name: Proyectos
  - name: Secciones landing
  - name: Servicios
  - name: Unidades de negocio
  - name: Contenido editorial
  - name: SEO
  - name: Solicitudes de contacto
  - name: Público
paths:
  /api/administradores:
    get:
      tags: [Administradores]
      operationId: listarAdministradores
      summary: Lista administradores
      x-access-intent: ADMINISTRATIVO
      responses:
        '200':
          description: Lista obtenida
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AdministradorResponse'}
  /api/administradores/{id}:
    get:
      tags: [Administradores]
      operationId: obtenerAdministradorPorId
      summary: Obtiene un administrador por UUID
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200': {$ref: '#/components/responses/AdministradorOk'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Administradores]
      operationId: actualizarAdministrador
      summary: Actualiza de forma controlada el perfil de un administrador
      description: No permite modificar passwordHash, roles, ultimoAcceso, id ni timestamps.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdministradorUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdministradorOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/administradores/{id}/activo:
    patch:
      tags: [Administradores]
      operationId: cambiarActivoAdministrador
      summary: Activa o desactiva lógicamente un administrador
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivoRequest'}
      responses:
        '200': {$ref: '#/components/responses/AdministradorOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/categorias:
    get:
      tags: [Categorías]
      operationId: listarCategorias
      summary: Lista categorías sin filtro de actividad
      x-access-intent: ADMINISTRATIVO
      responses:
        '200': {$ref: '#/components/responses/CategoriasOk'}
    post:
      tags: [Categorías]
      operationId: crearCategoria
      summary: Crea una categoría
      x-access-intent: ADMINISTRATIVO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoriaProductoRequest'}
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/categorias/activas:
    get:
      tags: [Categorías]
      operationId: listarCategoriasActivas
      summary: Lista categorías activas por orden ascendente
      x-access-intent: PUBLICO
      responses:
        '200': {$ref: '#/components/responses/CategoriasOk'}
  /api/categorias/activas/slug/{slug}:
    get:
      tags: [Categorías]
      operationId: obtenerCategoriaActivaPorSlug
      summary: Obtiene una categoría activa por slug
      x-access-intent: PUBLICO
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Categoría activa encontrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaProductoResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/categorias/{id}:
    get:
      tags: [Categorías]
      operationId: obtenerCategoriaPorId
      summary: Obtiene una categoría por UUID sin filtro de actividad
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaProductoResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Categorías]
      operationId: actualizarCategoria
      summary: Actualiza una categoría y resuelve su unidad por UUID
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoriaProductoUpdateRequest'}
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/categorias/{id}/activo:
    patch:
      tags: [Categorías]
      operationId: cambiarActivoCategoria
      summary: Activa o desactiva lógicamente una categoría
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivoRequest'}
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/categorias/slug/{slug}:
    get:
      tags: [Categorías]
      operationId: obtenerCategoriaPorSlug
      summary: Obtiene una categoría por slug sin filtro de actividad
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoriaProductoResponse'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/configuracion-sitio:
    get:
      tags: [Configuración del sitio]
      operationId: listarConfiguracionesSitio
      summary: Lista configuraciones de sitio
      x-access-intent: PUBLICO_PREVISTO
      responses:
        '200':
          description: Lista obtenida
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ConfiguracionSitioResponse'}
    post:
      tags: [Configuración del sitio]
      operationId: crearConfiguracionSitio
      summary: Crea una configuración de sitio
      x-access-intent: ADMINISTRATIVO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfiguracionSitioRequest'}
      responses:
        '201':
          description: Configuración creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfiguracionSitioResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/configuracion-sitio/{id}:
    get:
      tags: [Configuración del sitio]
      operationId: obtenerConfiguracionSitioPorId
      summary: Obtiene una configuración por UUID
      x-access-intent: PUBLICO_PREVISTO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Configuración encontrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfiguracionSitioResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Configuración del sitio]
      operationId: actualizarConfiguracionSitio
      summary: Actualiza campos raíz de una configuración
      description: Conserva empresa, secciones y scripts administrados fuera de este contrato.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfiguracionSitioUpdateRequest'}
      responses:
        '200':
          description: Configuración actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfiguracionSitioResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/cotizaciones:
    get:
      tags: [Cotizaciones]
      operationId: listarCotizaciones
      summary: Lista cotizaciones
      description: Incluye datos personales; acceso administrativo previsto.
      x-access-intent: ADMINISTRATIVO
      responses:
        '200': {$ref: '#/components/responses/CotizacionesOk'}
    post:
      tags: [Cotizaciones]
      operationId: crearCotizacion
      summary: Registra una solicitud de cotización
      x-access-intent: PUBLICO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CotizacionRequest'}
      responses:
        '201':
          description: Cotización creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CotizacionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/cotizaciones/{id}:
    get:
      tags: [Cotizaciones]
      operationId: obtenerCotizacionPorId
      summary: Obtiene una cotización por UUID
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200': {$ref: '#/components/responses/CotizacionOk'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/cotizaciones/{id}/estado:
    patch:
      tags: [Cotizaciones]
      operationId: cambiarEstadoCotizacion
      summary: Cambia el estado y registra un seguimiento histórico
      description: El administrador del seguimiento queda null hasta incorporar Security.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstadoCotizacionRequest'}
      responses:
        '200': {$ref: '#/components/responses/CotizacionOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/cotizaciones/codigo/{codigo}:
    get:
      tags: [Cotizaciones]
      operationId: obtenerCotizacionPorCodigo
      summary: Obtiene una cotización por código
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/CodigoCotizacion'
      responses:
        '200': {$ref: '#/components/responses/CotizacionOk'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/cotizaciones/estado/{estado}:
    get:
      tags: [Cotizaciones]
      operationId: listarCotizacionesPorEstado
      summary: Lista cotizaciones por estado
      x-access-intent: ADMINISTRATIVO
      parameters:
        - name: estado
          in: path
          required: true
          schema: {$ref: '#/components/schemas/EstadoCotizacion'}
      responses:
        '200': {$ref: '#/components/responses/CotizacionesOk'}
        '400':
          description: Valor de estado inválido; el cuerpo no está normalizado expresamente por GlobalExceptionHandler

  /api/empresa:
    get:
      tags: [Empresa]
      operationId: listarEmpresas
      summary: Lista empresas
      x-access-intent: PUBLICO_PREVISTO
      responses:
        '200': {$ref: '#/components/responses/EmpresasOk'}
    post:
      tags: [Empresa]
      operationId: crearEmpresa
      summary: Crea una empresa
      x-access-intent: ADMINISTRATIVO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmpresaRequest'}
      responses:
        '201':
          description: Empresa creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpresaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/empresa/{empresaId}/redes-sociales:
    post:
      tags: [Empresa]
      operationId: crearRedSocialEmpresa
      summary: Agrega un enlace social a una empresa existente
      description: Endpoint administrativo temporalmente sin Security/JWT. No acepta empresaId, id ni timestamps en el body.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - name: empresaId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedSocialRequest'}
      responses:
        '201':
          description: Red social creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RedSocialResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/empresa/{empresaId}/redes-sociales/{redSocialId}:
    put:
      tags: [Empresa]
      operationId: actualizarRedSocialEmpresa
      summary: Actualiza un enlace social sin cambiar de empresa
      description: Si la red existe pero pertenece a otra empresa, responde 400. Endpoint administrativo temporalmente sin Security/JWT.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - name: empresaId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: redSocialId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedSocialRequest'}
      responses:
        '200':
          description: Red social actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RedSocialResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Empresa]
      operationId: eliminarRedSocialEmpresa
      summary: Elimina un enlace social de una empresa
      description: Retira el hijo del agregado; orphanRemoval elimina la fila. Endpoint administrativo temporalmente sin Security/JWT.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - name: empresaId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: redSocialId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Red social eliminada}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/empresa/{id}:
    get:
      tags: [Empresa]
      operationId: obtenerEmpresaPorId
      summary: Obtiene una empresa por UUID
      x-access-intent: PUBLICO_PREVISTO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpresaResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Empresa]
      operationId: actualizarEmpresa
      summary: Actualiza los campos raíz de una empresa
      description: Conserva redes sociales, unidades y configuración del sitio.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmpresaUpdateRequest'}
      responses:
        '200':
          description: Empresa actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmpresaResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/productos:
    get:
      tags: [Productos]
      operationId: listarProductos
      summary: Lista productos sin filtro editorial
      x-access-intent: ADMINISTRATIVO
      responses:
        '200': {$ref: '#/components/responses/ProductosOk'}
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Crea un producto y sus hijos
      x-access-intent: ADMINISTRATIVO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductoRequest'}
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/productos/publicados:
    get:
      tags: [Productos]
      operationId: listarProductosPublicados
      summary: Lista productos con estado PUBLICADO
      x-access-intent: PUBLICO
      responses:
        '200': {$ref: '#/components/responses/ProductosOk'}
  /api/productos/publicados/slug/{slug}:
    get:
      tags: [Productos]
      operationId: obtenerProductoPublicadoPorSlug
      summary: Obtiene un producto publicado por slug
      x-access-intent: PUBLICO
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': {$ref: '#/components/responses/ProductoOk'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/productos/publicados/sku/{sku}:
    get:
      tags: [Productos]
      operationId: obtenerProductoPublicadoPorSku
      summary: Obtiene un producto publicado por SKU
      x-access-intent: PUBLICO
      parameters:
        - $ref: '#/components/parameters/Sku'
      responses:
        '200': {$ref: '#/components/responses/ProductoOk'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/productos/{id}:
    get:
      tags: [Productos]
      operationId: obtenerProductoPorId
      summary: Obtiene un producto por UUID sin filtro editorial
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200': {$ref: '#/components/responses/ProductoOk'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Productos]
      operationId: actualizarProducto
      summary: Actualiza campos raíz, unidad y categorías de un producto
      description: |
        Conserva variantes, imágenes, especificaciones, documentos y configuración de cálculo.
        Si cambia unidadNegocioId, el dominio sincroniza la unidad anterior y la nueva sin dejar
        temporalmente nula la relación obligatoria y sin eliminar el producto.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductoUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/ProductoOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/productos/{id}/estado:
    patch:
      tags: [Productos]
      operationId: cambiarEstadoProducto
      summary: Cambia el estado editorial del producto
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstadoPublicacionRequest'}
      responses:
        '200': {$ref: '#/components/responses/ProductoOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/productos/{productoId}/variantes:
    post:
      tags: [Productos]
      operationId: crearVarianteProducto
      summary: Agrega una variante a un producto existente
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VarianteProductoRequest'}
      responses:
        '201':
          description: Variante creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VarianteProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/productos/{productoId}/variantes/{varianteId}:
    put:
      tags: [Productos]
      operationId: actualizarVarianteProducto
      summary: Reemplaza los campos editables de una variante del producto
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/ProductoId'
        - $ref: '#/components/parameters/VarianteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VarianteProductoRequest'}
      responses:
        '200':
          description: Variante actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VarianteProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Productos]
      operationId: eliminarVarianteProducto
      summary: Elimina una variante mediante orphanRemoval
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/ProductoId'
        - $ref: '#/components/parameters/VarianteId'
      responses:
        '204': {description: Variante eliminada}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/productos/{productoId}/imagenes:
    post:
      tags: [Productos]
      operationId: crearImagenProducto
      summary: Agrega una URL de imagen a un producto existente
      description: No carga archivos. El dominio permite más de una imagen con esPrincipal=true.
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/ProductoId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImagenProductoRequest'}
      responses:
        '201':
          description: Imagen creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImagenProductoResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/productos/{productoId}/imagenes/{imagenId}:
    put:
      tags: [Productos]
      operationId: actualizarImagenProducto
