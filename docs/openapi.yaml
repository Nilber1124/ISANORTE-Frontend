  /api/unidades-negocio/{id}/activo:
    patch:
      tags: [Unidades de negocio]
      operationId: cambiarActivoUnidadNegocio
      summary: Activa o desactiva lógicamente una unidad
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivoRequest'}
      responses:
        '200': {$ref: '#/components/responses/UnidadOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/unidades-negocio/slug/{slug}:
    get:
      tags: [Unidades de negocio]
      operationId: obtenerUnidadNegocioPorSlug
      summary: Obtiene una unidad por slug sin filtro de actividad
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': {$ref: '#/components/responses/UnidadOk'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Slug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    Sku:
      name: sku
      in: path
      required: true
      schema: {type: string}
    CodigoCotizacion:
      name: codigo
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Request inválido, validación fallida o JSON no legible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    NotFound:
      description: Recurso o relación no encontrada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    Conflict:
      description: Estado, duplicado o integridad en conflicto
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiErrorResponse'}
    AdministradorOk:
      description: Administrador encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdministradorResponse'}
    CategoriasOk:
      description: Lista de categorías
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/CategoriaProductoResponse'}
    CotizacionOk:
      description: Cotización encontrada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CotizacionResponse'}
    CotizacionesOk:
      description: Lista de cotizaciones
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/CotizacionResponse'}
    EmpresasOk:
      description: Lista de empresas
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/EmpresaResponse'}
    ProductoOk:
      description: Producto encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProductoResponse'}
    ProductosOk:
      description: Lista de productos
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/ProductoResponse'}
    ProyectoOk:
      description: Proyecto encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProyectoResponse'}
    ProyectosOk:
      description: Lista de proyectos
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/ProyectoResponse'}
    SeccionesOk:
      description: Lista de secciones
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/SeccionLandingResponse'}
    ServicioOk:
      description: Servicio encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ServicioResponse'}
    ServiciosOk:
      description: Lista de servicios
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/ServicioResponse'}
    UnidadOk:
      description: Unidad encontrada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnidadNegocioResponse'}
    UnidadesOk:
      description: Lista de unidades
      content:
        application/json:
          schema:
            type: array
            items: {$ref: '#/components/schemas/UnidadNegocioResponse'}
  schemas:
    CanalCotizacion:
      type: string
      enum: [FORMULARIO, WHATSAPP]
    EstadoCotizacion:
      type: string
      enum: [NUEVA, EN_REVISION, CONTACTADA, COTIZADA, CERRADA, CANCELADA]
    EstadoDisponibilidad:
      type: string
      enum: [DISPONIBLE, AGOTADO, BAJO_PEDIDO, CONSULTAR]
    EstadoPublicacion:
      type: string
      enum: [BORRADOR, PUBLICADO, OCULTO]
    TipoDocumentoProducto:
      type: string
      enum: [CATALOGO, FICHA_TECNICA, MANUAL, OTRO]
    TipoImagenProyecto:
      type: string
      enum: [GENERAL, ANTES, DESPUES]
    TipoSeccionLanding:
      type: string
      enum: [HERO, EMPRESA, SERVICIOS, PROYECTOS, CONTACTO, CTA, PERSONALIZADA]

    AdministradorRequest:
      type: object
      description: DTO existente sin endpoint HTTP consumidor actual.
      required: [nombre, email]
      properties:
        nombre: {type: string, minLength: 1}
        apellido: {type: string, nullable: true}
        email: {type: string, format: email, minLength: 1}
        telefono: {type: string, nullable: true}
        activo: {type: boolean, nullable: true}
    CategoriaProductoRequest:
      type: object
      required: [nombre, slug]
      properties:
        nombre: {type: string, minLength: 1}
        slug: {type: string, minLength: 1}
        descripcion: {type: string, nullable: true}
        imagenUrl: {type: string, nullable: true}
        activo: {type: boolean, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
        unidadNegocioId: {type: string, format: uuid, nullable: true}
    ConfiguracionSitioRequest:
      type: object
      required: [empresaId]
      properties:
        empresaId: {type: string, format: uuid}
        tituloSitio: {type: string, nullable: true}
        descripcionSitio: {type: string, nullable: true}
        logoUrl: {type: string, nullable: true}
        logoBlancoUrl: {type: string, nullable: true}
        faviconUrl: {type: string, nullable: true}
        colorPrimario: {type: string, nullable: true}
        colorSecundario: {type: string, nullable: true}
        textoPiePagina: {type: string, nullable: true}
        secciones:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ConfiguracionSeccionRequest'}
    ConfiguracionSeccionRequest:
      type: object
      required: [tipo]
      properties:
        tipo: {$ref: '#/components/schemas/TipoSeccionLanding'}
        titulo: {type: string, nullable: true}
        subtitulo: {type: string, nullable: true}
        contenido: {type: string, nullable: true}
        imagenUrl: {type: string, nullable: true}
        textoBoton: {type: string, nullable: true}
        enlaceBoton: {type: string, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
        visible: {type: boolean, nullable: true}
    CotizacionRequest:
      type: object
      required: [nombreCliente, emailCliente, telefonoCliente, canal, detalles]
      properties:
        nombreCliente: {type: string, minLength: 1}
        emailCliente: {type: string, format: email, minLength: 1}
        telefonoCliente: {type: string, minLength: 1}
        empresaCliente: {type: string, nullable: true}
        ciudad: {type: string, nullable: true}
        mensaje: {type: string, nullable: true}
        canal: {$ref: '#/components/schemas/CanalCotizacion'}
        detalles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CotizacionDetalleRequest'}
    CotizacionDetalleRequest:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId: {type: string, format: uuid}
        varianteId: {type: string, format: uuid, nullable: true}
        cantidad: {type: integer, format: int32, minimum: 1}
        notas: {type: string, nullable: true}
    EmpresaRequest:
      type: object
      required: [razonSocial, nombreComercial, ruc]
      properties:
        razonSocial: {type: string, minLength: 1}
        nombreComercial: {type: string, minLength: 1}
        ruc: {type: string, minLength: 1}
        direccion: {type: string, nullable: true}
        ciudad: {type: string, nullable: true}
        telefono: {type: string, nullable: true}
        telefonoSecundario: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        emailVentas: {type: string, format: email, nullable: true}
        whatsapp: {type: string, nullable: true}
        horarioAtencion: {type: string, nullable: true}
        mision: {type: string, nullable: true}
        vision: {type: string, nullable: true}
        valores: {type: string, nullable: true}
        resumenNosotros: {type: string, nullable: true}
        redesSociales:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/RedSocialRequest'}
    RedSocialRequest:
      type: object
      required: [nombre, url]
      properties:
        nombre: {type: string, minLength: 1}
        url: {type: string, minLength: 1}
        icono: {type: string, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
        activo: {type: boolean, nullable: true}
    ProductoRequest:
      type: object
      required: [sku, nombre, slug, descripcion, disponibilidad, estado, unidadNegocioId]
      properties:
        sku: {type: string, minLength: 1}
        nombre: {type: string, minLength: 1}
        slug: {type: string, minLength: 1}
        resumen: {type: string, nullable: true}
        descripcion: {type: string, minLength: 1}
        precioBase: {type: number, minimum: 0, nullable: true}
        precioAnterior: {type: number, minimum: 0, nullable: true}
        descuentoPorcentaje: {type: number, minimum: 0, maximum: 100, nullable: true}
        disponibilidad: {$ref: '#/components/schemas/EstadoDisponibilidad'}
        destacado: {type: boolean, nullable: true}
        estado: {$ref: '#/components/schemas/EstadoPublicacion'}
        tituloSeo: {type: string, nullable: true}
        descripcionSeo: {type: string, nullable: true}
        unidadNegocioId: {type: string, format: uuid}
        categoriaIds:
          type: array
          uniqueItems: true
          nullable: true
          items: {type: string, format: uuid}
        variantes:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ProductoVarianteRequest'}
        imagenes:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ProductoImagenRequest'}
        especificaciones:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ProductoEspecificacionRequest'}
        documentos:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ProductoDocumentoRequest'}
        configuracionCalculo:
          allOf:
            - $ref: '#/components/schemas/ConfiguracionCalculoRequest'
          nullable: true
    ProductoVarianteRequest:
      type: object
      required: [sku, nombre]
      properties:
        sku: {type: string, minLength: 1}
        nombre: {type: string, minLength: 1}
        descripcion: {type: string, nullable: true}
        precio: {type: number, minimum: 0, nullable: true}
        disponible: {type: boolean, nullable: true}
        imagenUrl: {type: string, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
    ProductoImagenRequest:
      type: object
      required: [url]
      properties:
        url: {type: string, minLength: 1}
        altText: {type: string, nullable: true}
        esPrincipal: {type: boolean, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
    ProductoEspecificacionRequest:
      type: object
      required: [clave, valor]
      properties:
        clave: {type: string, minLength: 1}
        valor: {type: string, minLength: 1}
        grupo: {type: string, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
    ProductoDocumentoRequest:
      type: object
      required: [titulo, url, tipo]
      properties:
        titulo: {type: string, minLength: 1}
        url: {type: string, minLength: 1}
        tipo: {$ref: '#/components/schemas/TipoDocumentoProducto'}
        formato: {type: string, nullable: true}
        tamanoBytes: {type: integer, format: int64, minimum: 0, nullable: true}
    ConfiguracionCalculoRequest:
      type: object
      required: [coberturaPorUnidad]
      properties:
        habilitada: {type: boolean, nullable: true}
        etiquetaEntrada: {type: string, nullable: true}
        unidadEntrada: {type: string, nullable: true}
        coberturaPorUnidad: {type: number, exclusiveMinimum: true, minimum: 0}
        unidadVenta: {type: string, nullable: true}
        textoAyuda: {type: string, nullable: true}
    ProyectoRequest:
      type: object
      required: [nombre, slug, descripcion]
      properties:
        nombre: {type: string, minLength: 1}
        slug: {type: string, minLength: 1}
        cliente: {type: string, nullable: true}
        ubicacion: {type: string, nullable: true}
        fechaProyecto: {type: string, nullable: true, description: Texto libre; no tiene formato de fecha validado.}
        descripcion: {type: string, minLength: 1}
        destacado: {type: boolean, nullable: true}
        activo: {type: boolean, nullable: true}
        servicioIds:
          type: array
          uniqueItems: true
          nullable: true
          items: {type: string, format: uuid}
        imagenes:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ProyectoImagenRequest'}
    ProyectoImagenRequest:
      type: object
      required: [url, tipo]
      properties:
        url: {type: string, minLength: 1}
        titulo: {type: string, nullable: true}
        descripcion: {type: string, nullable: true}
        tipo: {$ref: '#/components/schemas/TipoImagenProyecto'}
        esPrincipal: {type: boolean, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
    SeccionLandingRequest:
      type: object
      required: [configuracionSitioId, tipo]
      properties:
        configuracionSitioId: {type: string, format: uuid}
        tipo: {$ref: '#/components/schemas/TipoSeccionLanding'}
        titulo: {type: string, nullable: true}
        subtitulo: {type: string, nullable: true}
        contenido: {type: string, nullable: true}
        imagenUrl: {type: string, nullable: true}
        textoBoton: {type: string, nullable: true}
        enlaceBoton: {type: string, nullable: true}
        orden: {type: integer, format: int32, nullable: true}
        visible: {type: boolean, nullable: true}
    ServicioRequest:
      type: object
      required: [nombre, slug, descripcion]
      properties:
        nombre: {type: string, minLength: 1}
        slug: {type: string, minLength: 1}
        resumen: {type: string, nullable: true}
        descripcion: {type: string, minLength: 1}
        icono: {type: string, nullable: true}
        imagenUrl: {type: string, nullable: true}
        activo: {type: boolean, nullable: true}
        destacado: {type: boolean, nullable: true}
