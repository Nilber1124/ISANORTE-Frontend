            schema: {$ref: '#/components/schemas/UnidadNegocioRequest'}
      responses:
        '201':
          description: Unidad creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnidadNegocioResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/unidades-negocio/activas:
    get:
      tags: [Unidades de negocio]
      operationId: listarUnidadesNegocioActivas
      summary: Lista unidades activas por orden ascendente
      x-access-intent: PUBLICO
      responses:
        '200': {$ref: '#/components/responses/UnidadesOk'}
  /api/unidades-negocio/activas/slug/{slug}:
    get:
      tags: [Unidades de negocio]
      operationId: obtenerUnidadNegocioActivaPorSlug
      summary: Obtiene una unidad activa por slug
      x-access-intent: PUBLICO
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200': {$ref: '#/components/responses/UnidadOk'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/unidades-negocio/{id}:
    get:
      tags: [Unidades de negocio]
      operationId: obtenerUnidadNegocioPorId
      summary: Obtiene una unidad por UUID sin filtro de actividad
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200': {$ref: '#/components/responses/UnidadOk'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Unidades de negocio]
      operationId: actualizarUnidadNegocio
      summary: Actualiza una unidad sin permitir cambiar su empresa
      x-access-intent: ADMINISTRATIVO
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UnidadNegocioUpdateRequest'}
      responses:
        '200': {$ref: '#/components/responses/UnidadOk'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
